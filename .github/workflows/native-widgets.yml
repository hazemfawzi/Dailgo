name: Native widget builds
on:
  pull_request:
    paths: ['native/**', '.github/workflows/native-widgets.yml']
  push:
    branches: ['main', 'codex/**']
    paths: ['native/**', '.github/workflows/native-widgets.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug :app:lintDebug
        working-directory: native/android
      - uses: actions/upload-artifact@v4
        with:
          name: dailgo-android-widget-debug
          path: native/android/app/build/outputs/apk/debug/*.apk
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: native/ios
      - run: xcodebuild -project DailgoWidget.xcodeproj -scheme Dailgo -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
        working-directory: native/ios
